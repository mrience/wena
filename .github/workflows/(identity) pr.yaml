on: 
    pull_request:
        types: [opened, synchronize, reopened, labeled]
        paths:
            - "wena-terraform/identity/**"
            - ".github/workflows/(identity) release.yaml"
            - ".github/workflows/(identity) pr.yaml"

permissions:
  contents: read
  pull-requests: write
  id-token: write
  
env:
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  HUSKY: 0

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    environment: identity

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v 6.0.2
    
    - name: Assume Github OIDC Role
      uses: ./.github/actions/assume-aws-role
      with:
        aws-account-id: ${{ vars.AWS_IDENTITY_ACCOUNT_ID }}
        role-name: "@GithubOidc"

    - name: Terraform Plan
      uses: ./.github/actions/terraform-plan
      with:
        config-directory: wena-terraform/identity
        tf-workspace: ${{ vars.TF_WORKSPACE }}

