on:
  push:
    branches: [main]
    paths:
      - "wena-terraform/identity/**"

permissions:
  contents: read
  id-token: write


env:
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"

jobs:
  deploy:
    name: Wena Identity infrastructure deployment
    runs-on: ubuntu-latest
    environment: identity

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Assume Github OIDC Role
      uses: ./.github/actions/assume-aws-role
      with:
        aws-account-id: ${{ vars.AWS_IDENTITY_ACCOUNT_ID }}
        role-name: "@GithubOidc"

    - name: Terraform Plan
      uses: ./.github/actions/terraform-plan
      with:
        config-directory: wena-terraform/identity
        tf-workspace: ${{ vars.TF_WORKSPACE }}

    - name: Terraform Apply
      uses: ./.github/actions/terraform-apply
      with:
        config-directory: wena-terraform/identity
        tf-workspace: ${{ vars.TF_WORKSPACE }}

  