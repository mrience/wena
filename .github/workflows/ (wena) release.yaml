on:
  push:
    branches: [main]
    paths-ignore:
      - "wena-tests/**"
      - "wena-terraform/identity/**"

permissions:
  contents: read
  id-token: write


env:
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"

jobs:
  deploy:
    name: Wena infrastructure deployment to ${{ matrix.environment }} environment
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]

    environment: ${{ matrix.environment }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-west-1

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v 6.0.2
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b #v6.2.0
      with:
        role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/@GithubOidc 
        aws-region: ${{ env.AWS_REGION }}

    - name: Terraform Plan
      uses: ./.github/actions/terraform-plan
      with:
        tf-workspace: ${{ vars.TF_WORKSPACE }}

    - name: Terraform Apply
      uses: ./.github/actions/terraform-apply
      with:
        tf-workspace: ${{ vars.TF_WORKSPACE }}

  